name: My TV build

# Builds the launcher, the prayer-times and matches add-ons, and the wallpaper theme, and puts them in
# one small download: Actions > the latest run > Artifacts > my-tv. Build logs go to the build-logs branch.
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build everything
        run: |
          mkdir -p /tmp/logs
          status=0
          step() { name=$1; shift; echo "== $name"; if ( set -o pipefail; "$@" 2>&1 | tee /tmp/logs/$name.txt ); then echo "OK $name" >> /tmp/logs/summary.txt; else echo "FAILED $name" >> /tmp/logs/summary.txt; status=1; fi; }
          step launcher bash -c 'cd launcher && chmod +x gradlew && ./gradlew --no-daemon assembleRelease'
          step prayer bash -c 'cd addons/prayer-times && chmod +x gradlew && ./gradlew --no-daemon assembleRelease'
          step matches bash -c 'cd addons/matches && chmod +x gradlew && ./gradlew --no-daemon assembleRelease'
          step wallpapers bash -c 'pip install -q pillow && python mytv/fetch_wallpapers.py'
          cat /tmp/logs/summary.txt
          exit $status
      - name: Save logs to the build-logs branch
        if: always()
        run: |
          cd /tmp/logs 2>/dev/null || exit 0
          for f in *.txt; do tail -n 300 "$f" > "$f.tmp" && mv "$f.tmp" "$f"; done
          git init -q . && git checkout -q -b build-logs
          git -c user.name=build -c user.email=build@localhost add -A
          git -c user.name=build -c user.email=build@localhost commit -q -m "logs ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" build-logs
      - name: Package
        run: |
          mkdir -p out/mytv
          cp launcher/app/build/outputs/apk/release/app-release.apk out/mytv/launcher.apk
          cp addons/prayer-times/app/build/outputs/apk/release/app-release.apk out/mytv/prayer-times.apk
          cp addons/matches/app/build/outputs/apk/release/app-release.apk out/mytv/matches.apk
          cp -r mytv/theme mytv/install.ps1 mytv/theme.ps1 mytv/handover.ps1 out/mytv/
          du -sh out/mytv
      - uses: actions/upload-artifact@v4
        with:
          name: my-tv
          path: out
          retention-days: 30
